# Set up services
services:
  # Database
  mariadb:
    build:
      context: ./requirements/MariaDB
      dockerfile: Dockerfile
    # Load .env
    env_file:
      - .env
    environment:
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    ports:
      - "3306:3306"
    networks:
      - inception
    volumes: # volume_name:path/to/container_folder
      - database_data:/var/lib/mysql
    restart: always

  # Website
  wordpress:
    build:
      context: ./requirements/WordPress
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - inception
    volumes:
      - website_data:/var/www/html
    restart: always

  # Web server
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    env_file:
      - .env
    ports: # Port forwarding, allows access from outside Docker container
      - 443:443 # host:container
    networks:
      - inception
    restart: always

# Create a network to link services
networks:
  inception:
    driver: bridge

# Save data outside of container
volumes:
  database_data:
  website_data:
